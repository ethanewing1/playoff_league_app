name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Run notebook and commit outputs"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # Only deploy if the notebook workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
      # If your Pages site is just static files already in the repo (no build):
      - name: Prepare site
        run: cp -r league_pages index/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: index/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4