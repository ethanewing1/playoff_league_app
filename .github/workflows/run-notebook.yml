name: Run notebook and commit outputs

on:
  workflow_dispatch: {}
  schedule:
    - cron: "50 17 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notebook
        run: |
          papermill playground.ipynb playground.executed.ipynb

      - name: Commit and push changes to automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automated data refresh ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push origin HEAD:main